location ^~ /nor-nakhijevan/api/sketch/ {
    limit_req zone=nn_glyph_preview burst=100 nodelay;
    proxy_pass http://127.0.0.1:8797;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
}
location ^~ /nor-nakhijevan/api/ {
    client_max_body_size 1500k;
    limit_req zone=nn_glyph_review burst=15 nodelay;
    proxy_pass http://127.0.0.1:8797;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
}
