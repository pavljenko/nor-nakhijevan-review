<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Зарисовки · Նոր Նախիջևան</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#11134b;font:15px/1.5 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px 18px}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:24px}h1{font-weight:550;font-size:24px;margin:0}button,select,a{font:inherit;color:inherit}button,select,.back{background:white;border:1px solid #dedddf;border-radius:12px;padding:10px 15px;min-height:44px;cursor:pointer;text-decoration:none}.actions{display:flex;gap:8px;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.card{background:#fff;border:1px solid #dedddf;border-radius:18px;overflow:hidden}.picture{display:block;background:#fff}.picture img{width:100%;height:320px;display:block;object-fit:contain}.info{padding:15px 18px;border-top:1px solid #efefef}.info strong{font-size:26px;font-weight:500}.date{font-size:12px;color:#74737f;margin-left:12px}.note{white-space:pre-wrap;font-size:13px;margin:9px 0}.links{display:flex;gap:18px;font-size:12px}.links a{color:#74737f}.delete{margin-left:auto;padding:0 10px;min-height:34px;color:#a82e43;font-size:12px;border-color:#e5c8ce}.owner-badge{font-size:12px;color:#74737f}.message{font-size:14px;color:#74737f}dialog{border:0;border-radius:18px;width:min(96vw,1000px);padding:12px;background:#fff}dialog::backdrop{background:#11132abb}dialog img{width:100%;height:78dvh;object-fit:contain}dialog button{float:right}.count{color:#74737f;font-size:13px}@media(max-width:500px){main{padding:18px 14px}header{gap:12px}h1{font-size:22px}.actions{width:100%;margin:0}.actions select{flex:1}.grid{grid-template-columns:1fr}.picture img{height:360px}}
</style></head><body><main><header><a class="back" href="./" id="back" aria-label="К рисованию">←</a><h1>Зарисовки</h1><span class="count" id="count"></span><span id="owner-label" class="owner-badge"></span><div class="actions"><select id="filter" aria-label="Буква"><option value="">Все буквы</option></select><button id="refresh">Обновить</button></div></header><p class="message" id="message">Загрузка…</p><div class="grid" id="grid"></div></main><dialog id="lightbox"><button id="close" aria-label="Закрыть">×</button><img id="large" alt=""></dialog><script>
const base='https://raw.githubusercontent.com/pavljenko/nor-nakhijevan-review/drawings/', $=id=>document.getElementById(id);let records=[],stamp='',isOwner=false,deleted=[];const ownerKey=new URLSearchParams(location.hash.slice(1)).get('owner')||'',API=(location.hostname==='127.0.0.1'?'':'https://tools.pavljenko.ru')+'/nor-nakhijevan/api/';const backHash=new URLSearchParams(location.hash.slice(1));backHash.delete('owner');$('back').href='./'+(backHash.size?'#'+backHash:'');
function render(){const selected=$('filter').value,latest=new Map();for(const r of records)if(!deleted.some(d=>d.session===r.session&&d.glyph===r.glyph)&&(!selected||r.glyph===selected)){const k=r.session+'/'+r.glyph;if(!latest.has(k))latest.set(k,r)}$('grid').replaceChildren();$('count').textContent=latest.size;$('message').textContent=latest.size?'':'Зарисовок пока нет';for(const r of latest.values()){const card=document.createElement('article');card.className='card';const button=document.createElement('a');button.className='picture';button.href=base+r.svg;button.setAttribute('aria-label','Открыть '+r.char);const img=document.createElement('img');img.src=base+r.svg+'?v='+stamp;img.alt=r.char;img.loading='lazy';button.append(img);button.onclick=e=>{e.preventDefault();$('large').src=img.src;$('large').alt=r.char;$('lightbox').showModal()};const info=document.createElement('div');info.className='info';const char=document.createElement('strong');char.textContent=r.char;const date=document.createElement('span');date.className='date';date.textContent=new Date(r.created*1000).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});info.append(char,date);if(r.note){const note=document.createElement('p');note.className='note';note.textContent=r.note;info.append(note)}const links=document.createElement('div');links.className='links';for(const [name,path]of [['SVG',r.svg],['JSON',r.json]]){const a=document.createElement('a');a.textContent=name;a.href=base+path;a.target='_blank';a.rel='noopener';links.append(a)}if(isOwner){const del=document.createElement('button');del.className='delete';del.textContent='Удалить';del.setAttribute('aria-label','Удалить зарисовку '+r.char);del.onclick=()=>remove(r,del);links.append(del)}info.append(links);card.append(button,info);$('grid').append(card)}}
async function load(){const button=$('refresh');button.disabled=true;stamp=String(Date.now());try{const r=await fetch(base+'gallery.json?v='+stamp);if(!r.ok)throw Error();records=(await r.json()).records.sort((a,b)=>b.created-a.created);const selected=$('filter').value;$('filter').replaceChildren(new Option('Все буквы',''));for(const [id,char]of [...new Map(records.map(r=>[r.glyph,r.char]))].sort())$('filter').append(new Option(char,id));$('filter').value=selected;render()}catch{$('message').textContent='Не удалось загрузить галерею. Попробуйте обновить.'}finally{button.disabled=false}}async function ownerState(){if(!ownerKey)return;try{const r=await fetch(API+'owner',{headers:{'X-Owner-Key':ownerKey}});if(!r.ok)throw Error();const j=await r.json();isOwner=j.owner;deleted=j.deleted;$('owner-label').textContent='Личный режим';render();if(deleted.some(d=>d.status==='queued'))setTimeout(ownerState,2500)}catch{isOwner=false;$('owner-label').textContent='Нет доступа к управлению';render()}}
async function remove(r,button){if(!confirm('Удалить зарисовку '+r.char+' и все её промежуточные версии?'))return;button.disabled=true;try{const response=await fetch(API+'delete',{method:'POST',headers:{'Content-Type':'application/json','X-Owner-Key':ownerKey},body:JSON.stringify({session:r.session,glyph:r.glyph})});if(!response.ok)throw Error();await ownerState()}catch{$('message').textContent='Не удалось удалить. Попробуйте ещё раз.';button.disabled=false}}
$('refresh').onclick=async()=>{await ownerState();await load()};$('filter').onchange=render;$('close').onclick=()=>$('lightbox').close();ownerState().then(load);
</script></body></html>
