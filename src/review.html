<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f3ee"><title>Նոր Նախիջևան</title><style>
:root{--ink:#11134b;--paper:#f5f3ee;--line:#dedddf;color-scheme:light;font:16px/1.4 system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--ink)}button,a{font:inherit;color:inherit;touch-action:manipulation}button{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;cursor:pointer}button:disabled{opacity:.3}button:focus-visible,a:focus-visible{outline:3px solid #9293c8;outline-offset:2px}button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.arm{font-family:'Noto Sans Armenian',Sylfaen,'Arial Unicode MS',sans-serif}.app{height:100%;height:100svh;width:100%;min-width:0;overflow:hidden;touch-action:none;max-width:1100px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.top{display:flex;align-items:center;gap:7px;padding:8px 10px;flex:none}.cases{display:flex;gap:4px;flex:1}.cases button{font-size:26px;flex:1;padding:0 8px}.icon{font-size:22px;padding:0}.choose{font-size:13px;white-space:nowrap;padding:8px 10px}.stage{flex:1;min-height:0;position:relative;background:white;border-block:1px solid var(--line);overflow:hidden}.editor-canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}.drawing,.canvas-guides{pointer-events:none}.bottom{padding:8px 10px;flex:none}.tools{display:flex;justify-content:center;gap:6px;align-items:center;margin-bottom:8px}.tools button{width:44px;padding:8px}.tools svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.gallery{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:auto;text-decoration:none;border-radius:12px}.save{width:100%;min-height:48px;background:var(--ink);color:#fff;border-color:var(--ink);font-weight:550}.status{font-size:12px;color:#ad3040;text-align:center;margin-top:5px}.status:empty{display:none}dialog{border:0;background:var(--paper);color:var(--ink);padding:0;border-radius:20px;width:min(94vw,620px);max-height:88dvh;overflow:auto;overscroll-behavior:contain}dialog::backdrop{background:#10112b88}.sheethead{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:12px 16px;z-index:1}.sheethead h2{font-size:18px;margin:0;font-weight:550}.alphabet{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 16px 20px}.alphabet button{font-size:26px;min-height:56px;padding:6px 0;position:relative}.alphabet button.selected{background:var(--ink);color:#fff}.alphabet button.has-ink:after{content:'';width:5px;height:5px;background:#d63842;border-radius:50%;position:absolute;top:5px;right:5px}@media(max-height:450px){.top{padding:4px 8px}.bottom{padding:4px 8px}.tools{margin-bottom:4px}.save{min-height:42px}.tools button,.gallery{height:40px;min-height:40px}.cases button{min-height:40px}}

/* Keep the drawing surface independent of intrinsic SVG sizes, browser chrome,
   and save-status messages. The alphabet dialog remains separately scrollable. */
html{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.app{position:relative;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.top{display:grid;grid-template-columns:40px minmax(0,1fr) 68px 40px;gap:5px;padding:8px;min-width:0}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0}
.cases button{min-width:0;padding:0 2px;overflow:hidden}
.top .icon{width:40px;min-width:40px}.choose{min-width:0;padding:8px 2px;font-size:12px}
.stage{flex:1 1 0;min-width:0;touch-action:none;overscroll-behavior:none;contain:layout paint;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.editor-canvas{position:absolute;inset:0;max-width:100%;touch-action:none;-webkit-user-drag:none}
.bottom{position:relative;min-width:0}
.tools{display:grid;grid-template-columns:repeat(6,minmax(0,44px));justify-content:space-between;gap:5px;min-width:0}
.tools button,.gallery{width:100%;min-width:0;justify-items:center;margin-left:0}.tools button svg{margin:auto}
.status{position:absolute;bottom:100%;left:8px;right:8px;margin:0;padding:6px 8px;background:#fff4f3f2;border-radius:8px;overflow-wrap:anywhere;pointer-events:none}
.status a{pointer-events:auto}
dialog{max-height:88vh;max-height:88svh;touch-action:pan-y;overscroll-behavior:contain}
@media(max-height:450px){.top{padding:4px 8px}}
</style></head><body><main class="app"><nav class="top" aria-label="Выбор буквы"><button id="prev" class="icon" aria-label="Предыдущая пара">←</button><div class="cases" role="group" aria-label="Регистр буквы"><button id="upper" class="arm" aria-pressed="true"></button><button id="lower" class="arm" aria-pressed="false"></button></div><button id="choose" class="choose" aria-label="Выбрать пару букв"><span id="counter"></span> ⌄</button><button id="next" class="icon" aria-label="Следующая пара">→</button></nav><div class="stage" id="stage"></div><div class="bottom"><div class="tools" role="group" aria-label="Инструменты рисования"><button id="pen" aria-label="Перо" title="Перо" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 1 4 4-1L20 8l-5-5Z"/><path d="m13 5 5 5M5 16l4 3"/></svg></button><button id="line" aria-label="Прямая" title="Прямая" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 16-16"/><circle cx="4" cy="20" r="1"/><circle cx="20" cy="4" r="1"/></svg></button><button id="eraser" aria-label="Ластик" title="Ластик" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 14 10-11 8 8-9 10H9Z"/><path d="m7 10 8 8M12 21h9"/></svg></button><button id="undo" aria-label="Отменить штрих" title="Отменить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></svg></button><button id="redo" aria-label="Вернуть штрих" title="Вернуть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12" transform="translate(0 -2)"/></svg></button><a class="gallery" href="gallery.html" aria-label="Галерея зарисовок" title="Галерея"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a></div><button id="save" class="save">Сохранить</button><div id="status" class="status" role="status" aria-live="polite"></div></div></main><dialog id="picker" aria-labelledby="picker-title"><div class="sheethead"><h2 id="picker-title">Алфавит</h2><button id="close-picker" class="icon" aria-label="Закрыть алфавит">×</button></div><div id="alphabet" class="alphabet arm"></div></dialog><script>

const DATA=__GLYPHS__,NS='http://www.w3.org/2000/svg',API=(location.hostname==='127.0.0.1'?'':'https://tools.pavljenko.ru')+'/nor-nakhijevan/api/';
const key=new URLSearchParams(location.hash.slice(1)).get('key')||'',headers={'X-Review-Key':key},session=crypto.randomUUID(),$=id=>document.getElementById(id);
const glyphs=Object.fromEntries(DATA.pairs.flatMap(p=>[p.upper,p.lower]).map(g=>[g.id,g]));
let checkpointAt=0;
let pair=Math.max(0,Math.min(37,(parseInt(new URL(location).searchParams.get('pair'),10)||1)-1)),which='upper',mode='pen',color='#d63842',ghost=.12,models={},timer=null,drawing=null,editorSvg=null,pointer=null,viewScroll=0;
function current(){return DATA.pairs[pair][which]}
function model(id=current().id){return models[id]||=( {glyph:id,strokes:[],note:'',pending:false,version:0,redo:[]} )}
function status(text,kind=''){$('status').textContent=kind==='error'?text:'';$('save').textContent=kind==='saved'?'Сохранено ✓':text.includes('Сохраняем')?'Сохраняем…':'Сохранить'}
let localBackup,backupURL;try{localBackup=localStorage}catch{}
const outbox=new DrawingOutbox({storage:localBackup,send:async(body,signal)=>{
 const r=await fetch(API+'review',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body,signal,keepalive:new TextEncoder().encode(body).length<60000});
 if(!r.ok){const e=Error('save');e.permanent=[400,403,413].includes(r.status);throw e;}
 return r.json();
},onState:s=>{
 if(backupURL){URL.revokeObjectURL(backupURL);backupURL=null;}
 if(!key)return status('Откройте полную ссылку для сохранения.','error');
 if(s.error){status(s.error,'error');const a=document.createElement('a');a.textContent=' Скачать копию';a.href=backupURL=URL.createObjectURL(new Blob(['['+[...outbox.items.values()].join(',')+']'],{type:'application/json'}));a.download='nor-nakhijevan-backup.json';$('status').append(a);return;}
 if(s.pending)return status(s.storageFailed?'Нет резервной копии в браузере. Не закрывайте страницу до сохранения.':'Сохраняем…',s.storageFailed?'error':'');
 status('','saved');
}});
function stamp(id,delay=300){const m=model(id);m.version++;m.pending=true;outbox.put({session,glyph:id,revision:m.version,strokes:m.strokes,note:m.note},delay);markAlphabet()}
function flushAll(){return outbox.flush()}
function node(tag,attrs={}){const n=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);return n}
function path(points){return 'M'+points.map(p=>p.join(',')).join('L')+(points.length===1?'l.01,.01':'')}
function paint(svg,g){svg.querySelector('.drawing')?.remove();const layer=node('g',{class:'drawing'});for(const s of model(g.id).strokes)layer.append(node('path',{d:path(s.points),fill:'none',stroke:s.color,'stroke-width':s.width,'stroke-linecap':'round','stroke-linejoin':'round'}));svg.append(layer)}
function makeSvg(g,editable=false){const w=Math.max(1000,g.advance+200),svg=node('svg',{viewBox:`0 0 ${w} 1100`,role:'img','aria-label':(editable?'Холст рисования ':'Просмотр буквы ')+g.char,class:editable?'editor-canvas':'preview-canvas'});const guides=node('g',{class:'canvas-guides'});for(const y of[850,355,160,1045])guides.append(node('line',{x1:35,x2:w-35,y1:y,y2:y,stroke:'#dedde4','stroke-width':1.5,'stroke-dasharray':y===850?'':'7 8'}));svg.append(guides);const original=node('g',{class:'original',transform:`translate(${(w-g.advance)/2} 850) scale(1 -1)`,opacity:editable?ghost:.16});original.append(node('path',{d:g.path,fill:'#11134b'}));svg.append(original);paint(svg,g);if(editable)bindDrawing(svg,g);return svg}
function markAlphabet(){for(const b of $('alphabet').children){const i=Number(b.dataset.index);b.classList.toggle('selected',i===pair);b.classList.toggle('has-ink',['upper','lower'].some(c=>model(DATA.pairs[i][c].id).strokes.length))}}
function render(){const p=DATA.pairs[pair],g=current();$('counter').textContent=(pair+1)+' / 38';$('prev').disabled=pair===0;$('next').disabled=pair===37;for(const c of ['upper','lower']){$(c).textContent=p[c].char;$(c).setAttribute('aria-label',p[c].char+(c==='upper'?' — прописная':' — строчная'));$(c).setAttribute('aria-pressed',String(which===c))}editorSvg=makeSvg(g,true);$('stage').replaceChildren(editorSvg);const u=new URL(location);u.searchParams.set('pair',pair+1);history.replaceState(null,'',u);markAlphabet();tools()}
async function navigate(i){clearTimeout(timer);flushAll();pair=i;render();$('picker').close()}
function tools(){const m=model();$('undo').disabled=!m.strokes.length;$('redo').disabled=!m.redo.length;for(const k of['pen','line','eraser'])$(k).setAttribute('aria-pressed',String(mode===k));}
function distance(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l)):0;return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function eraseAt(g,p){const m=model(g.id);for(let i=m.strokes.length-1;i>=0;i--){const ps=m.strokes[i].points;if(ps.length===1?Math.hypot(p[0]-ps[0][0],p[1]-ps[0][1])<24:ps.some((v,j)=>j&&distance(p,ps[j-1],v)<24)){m.redo.push(m.strokes.splice(i,1)[0]);stamp(g.id);paint(editorSvg,g);tools();return}}}
function bindDrawing(svg,g){let strokeMatrix=null,activePath=null;const point=e=>{const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(strokeMatrix||svg.getScreenCTM().inverse());return[Math.round(p.x*10)/10,Math.round(p.y*10)/10]};svg.addEventListener('pointerdown',e=>{if(pointer!==null||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();strokeMatrix=svg.getScreenCTM().inverse();pointer=e.pointerId;svg.setPointerCapture(pointer);const p=point(e);if(mode==='eraser'){drawing={erase:true};eraseAt(g,p);return}drawing={id:crypto.randomUUID(),color,width:7,points:[p]};model(g.id).strokes.push(drawing);model(g.id).redo=[];paint(svg,g);activePath=svg.querySelector('.drawing path:last-child');tools()});svg.addEventListener('pointermove',e=>{if(!drawing||pointer!==e.pointerId)return;e.preventDefault();const p=point(e);if(drawing.erase)return eraseAt(g,p);if(mode==='line')drawing.points=[drawing.points[0],p];else if(Math.hypot(p[0]-drawing.points.at(-1)[0],p[1]-drawing.points.at(-1)[1])>1.3)drawing.points.push(p);activePath?.setAttribute('d',path(drawing.points));if(Date.now()-checkpointAt>500){checkpointAt=Date.now();stamp(g.id,5000)}});const end=e=>{if(pointer!==e.pointerId)return;const changed=!!drawing;pointer=null;drawing=null;strokeMatrix=null;activePath=null;if(changed)stamp(g.id);tools()};for(const k of['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(k,end)}
installCanvasGuards({app:document.querySelector('.app'),stage:$('stage'),document,isPickerOpen:()=>$('picker').open});
$('choose').onclick=()=>$('picker').showModal();$('close-picker').onclick=()=>$('picker').close();$('prev').onclick=()=>navigate(pair-1);$('next').onclick=()=>navigate(pair+1);for(const c of['upper','lower'])$(c).onclick=()=>{which=c;render()};for(let i=0;i<38;i++){const b=document.createElement('button');b.textContent=DATA.pairs[i].upper.char+DATA.pairs[i].lower.char;b.dataset.index=i;b.setAttribute('aria-label','Пара '+DATA.pairs[i].upper.char+' '+DATA.pairs[i].lower.char);b.onclick=()=>navigate(i);$('alphabet').append(b)}
for(const k of['pen','line','eraser'])$(k).onclick=()=>{mode=k;tools()};
$('undo').onclick=()=>{const m=model();if(m.strokes.length){m.redo.push(m.strokes.pop());stamp(current().id);paint(editorSvg,current());tools()}};$('redo').onclick=()=>{const m=model();if(m.redo.length){m.strokes.push(m.redo.pop());stamp(current().id);paint(editorSvg,current());tools()}};$('save').onclick=async()=>{clearTimeout(timer);await flushAll()};
window.addEventListener('online',flushAll);
function leave(){if(drawing&&!drawing.erase)stamp(current().id,0);flushAll()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)leave();else flushAll()});
window.addEventListener('pagehide',leave);
window.addEventListener('beforeunload',e=>{if(drawing||outbox.items.size){leave();e.preventDefault();e.returnValue=''}});
if(!key)status('Откройте полную ссылку для сохранения.','error');document.querySelector('.gallery').href='https://tools.pavljenko.ru/nor-gallery';render();if(outbox.items.size)flushAll();
showDrawingTutorial();
